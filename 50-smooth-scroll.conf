# smooth-scroll: the scroll device works in "button scrolling" mode (BTN_TASK = X button 12)
Section "InputClass"
    Identifier "smooth scroll wheel"
    MatchProduct "smooth scroll wheel"
    MatchDriver "libinput"
    Option "ScrollMethod" "button"
    Option "ScrollButton" "12"
    Option "NaturalScrolling" "true"
EndSection
